name: Daily Data Refresh

on:
  schedule:
    # 11:00 UTC — after most MLB games are final
    - cron: '0 11 * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Use PAT so the commit triggers Cloudflare Pages deploy
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run data pipeline
        id: pipeline
        run: python scripts/run.py
        env:
          PIPELINE_LOG_LEVEL: INFO

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet src/data/ || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          git commit -m "data: refresh $(date -u +%Y-%m-%d)"
          git push

      - name: No changes
        if: steps.changes.outputs.changed != 'true'
        run: echo "Data unchanged — skipping commit."

  on-failure:
    needs: refresh
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open issue on pipeline failure
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Pipeline] Daily data refresh failed — ${new Date().toISOString().slice(0, 10)}`,
              body: `The daily data pipeline failed.\n\nRun: ${runUrl}`,
              labels: ['bug', 'data-pipeline'],
            });
