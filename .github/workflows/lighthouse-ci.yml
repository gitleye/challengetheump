name: Lighthouse CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse
        run: |
          lhci autorun \
            --collect.staticDistDir=dist \
            --collect.url=/ \
            --collect.url=/teams \
            --collect.url=/players \
            --collect.url=/methodology \
            --assert.preset=lighthouse:recommended \
            --assert.assertions.categories:performance=off \
            --assert.assertions.categories:accessibility="error; minScore=0.9" \
            --assert.assertions.categories:best-practices="error; minScore=0.9" \
            --assert.assertions.categories:seo="error; minScore=0.9"
