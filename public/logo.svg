<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 40" fill="none" role="img" aria-label="Challenge The Ump">
  <!-- ABS-style strike zone -->
  <rect x="2" y="6" width="22" height="28" rx="1.5" stroke="currentColor" stroke-width="1.8" fill="none" class="logo-zone"/>
  <!-- 9-section grid lines -->
  <line x1="2" y1="15.3" x2="24" y2="15.3" stroke="currentColor" stroke-width="0.5" opacity="0.35"/>
  <line x1="2" y1="24.7" x2="24" y2="24.7" stroke="currentColor" stroke-width="0.5" opacity="0.35"/>
  <line x1="9.3" y1="6" x2="9.3" y2="34" stroke="currentColor" stroke-width="0.5" opacity="0.35"/>
  <line x1="16.7" y1="6" x2="16.7" y2="34" stroke="currentColor" stroke-width="0.5" opacity="0.35"/>
  <!-- Pitch dots -->
  <circle cx="13" cy="20" r="2.5" fill="#22C55E" opacity="0.9"/>
  <circle cx="19" cy="12" r="2" fill="#FACC15" opacity="0.8"/>
  <!-- Wordmark -->
  <text x="34" y="27" font-family="Space Grotesk, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.03em" fill="currentColor">
    Challenge <tspan class="logo-accent">The Ump</tspan>
  </text>
</svg>
